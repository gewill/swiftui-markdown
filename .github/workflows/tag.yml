name: Create Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Both are needed to resolve the previous tag for the comparison link:
          # depth alone leaves the checkout without the other tags.
          fetch-depth: 0
          fetch-tags: true

      # The release notes come from CHANGELOG.md rather than from generated
      # commit summaries: the curated entry says why each change happened, and
      # reading a file does not depend on a previous release existing.
      - name: Extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          # Reference-style links used above are defined at the end of the file.
          grep -E '^\[[^]]+\]: ' CHANGELOG.md >> release-notes.md

          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full diff**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> release-notes.md
          else
            echo "::warning::no earlier tag reachable from $GITHUB_REF_NAME; omitting the comparison link"
          fi
          printf '\n**Documentation**: https://swiftpackageindex.com/%s/documentation/markdown\n' \
            "$GITHUB_REPOSITORY" >> release-notes.md

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          bodyFile: release-notes.md
